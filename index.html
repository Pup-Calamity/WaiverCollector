<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaiverIO</title>
    <!-- Load SheetJS for Excel Parsing -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        button { padding: 10px 20px; margin-right: 10px; cursor: pointer; }
        #output { background: #1e1e1e; color: #4af626; padding: 20px; border-radius: 5px; font-family: monospace; white-space: pre-wrap; height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <h2>Local Excel Connection</h2>
    <button id="folderBtn">1. Connect Waiver Folder</button>
    <button id="readExcelBtn" disabled>2. Read Tracker Data</button>
    
    <p><strong>Data Output:</strong></p>
    <div id="output">Waiting for folder connection...</div>

    <script>
        let dirHandle;

        // Step 1: Connect to the folder
        document.getElementById('folderBtn').addEventListener('click', async () => {
            try {
                dirHandle = await window.showDirectoryPicker();
                document.getElementById('output').textContent = `Connected to folder: ${dirHandle.name}\nReady to read Excel data.`;
                document.getElementById('readExcelBtn').disabled = false;
            } catch (error) {
                document.getElementById('output').textContent = "Folder selection cancelled.";
            }
        });

        // Step 2: Read the Excel File
        document.getElementById('readExcelBtn').addEventListener('click', async () => {
            try {
                const outputDiv = document.getElementById('output');
                outputDiv.textContent = "Loading Excel file...\n";

                // NOTE: Change 'Invoices.xlsx' to the exact name of a file in your test folder
                const targetFileName = 'Invoices.xlsx'; 
                
                const fileHandle = await dirHandle.getFileHandle(targetFileName, { create: false });
                const file = await fileHandle.getFile();
                const arrayBuffer = await file.arrayBuffer();

                // Parse the Excel file using SheetJS
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                
                // Grab the first sheet
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to an array of JavaScript objects (JSON)
                const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                // Display the first 3 rows to prove it worked
                outputDiv.textContent = `Successfully parsed ${targetFileName}!\n\n` + 
                                        `Total Rows: ${jsonData.length}\n\n` +
                                        `First 3 Rows Data:\n` + 
                                        JSON.stringify(jsonData.slice(0, 3), null, 2);

            } catch (error) {
                document.getElementById('output').textContent = `Error finding or reading file: ${error.message}\nMake sure the file name matches exactly.`;
            }
        });
    </script>
</body>
</html>
