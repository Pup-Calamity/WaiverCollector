<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaiverIO</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        button { padding: 10px 20px; margin-right: 10px; margin-bottom: 10px; cursor: pointer; }
        #output { background: #1e1e1e; color: #4af626; padding: 20px; border-radius: 5px; font-family: monospace; white-space: pre-wrap; height: 150px; overflow-y: auto; }
        .action-group { margin-top: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 5px; background: #f9f9f9; }
    </style>
</head>
<body>
    <h2>Waiver Management Engine</h2>
    <button id="folderBtn">1. Connect Master AR Folder</button>

    <div class="action-group">
        <strong>Visual Template Mapper</strong><br><br>
        <button id="loadPdfBtn">1. Load PDF to Canvas</button>
        <button id="saveMapBtn" disabled>2. Save JSON Map</button>
        
        <div style="margin-top: 15px; border: 1px solid #ccc; display: inline-block;">
            <canvas id="pdfCanvas" style="cursor: crosshair;"></canvas>
        </div>
    </div>
    
    <div class="action-group">
        <strong>Template Manager</strong><br><br>
        <button id="uploadTemplateBtn" disabled>Upload New PDF Template</button>
    </div>
    
    <p><strong>Console:</strong></p>
    <div id="output">Waiting for folder connection...</div>

    <script>
        let dirHandle;

        // 1. Connect to the master folder
        document.getElementById('folderBtn').addEventListener('click', async () => {
            try {
                dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' }); 
                document.getElementById('output').textContent = `Connected to: ${dirHandle.name}\nReady for operations.`;
                document.getElementById('uploadTemplateBtn').disabled = false;
            } catch (error) {
                document.getElementById('output').textContent = "Folder connection failed.";
            }
        });

        // 2. Upload and store a new template
        document.getElementById('uploadTemplateBtn').addEventListener('click', async () => {
            try {
                const outputDiv = document.getElementById('output');
                
                // Prompt user to select a PDF file from anywhere on their computer
                const [fileHandle] = await window.showOpenFilePicker({
                    types: [{ description: 'PDF Templates', accept: { 'application/pdf': ['.pdf'] } }]
                });
                const file = await fileHandle.getFile();
                outputDiv.textContent = `Selected template: ${file.name}\nCreating Templates subfolder...`;

                // Get or create the "Templates" subfolder inside the connected AR folder
                const templatesDir = await dirHandle.getDirectoryHandle('Templates', { create: true });

                // Create a new file inside the Templates subfolder and write the PDF data to it
                const newFileHandle = await templatesDir.getFileHandle(file.name, { create: true });
                const writable = await newFileHandle.createWritable();
                await writable.write(file);
                await writable.close();

                outputDiv.textContent += `\nSuccess! Template saved to /Templates/${file.name}`;

            } catch (error) {
                document.getElementById('output').textContent = `Upload failed: ${error.message}`;
            }
        });
    </script>
</body>
</html>
